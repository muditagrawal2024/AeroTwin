# Optional: copy this file to .github/workflows/deploy-aws.yml in your repository
# to deploy to S3 + CloudFront on every push to main.
name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload site and invalidate CloudFront
        run: bash deploy/deploy.sh "${{ secrets.S3_BUCKET }}" "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
